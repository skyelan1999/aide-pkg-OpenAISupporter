name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check index.js
      - run: python3 scripts/package.py
      - run: cd dist && sha256sum --check SHA256SUMS
